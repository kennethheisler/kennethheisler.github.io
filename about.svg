<!--
  PLACEHOLDER IMAGE: images/about.svg (800 x 600)
  WHAT: A stand-in picture drawn with code: connected circles that hint
        at people and ideas working together.
  HOW TO SWAP IT: Save your real image (JPG, PNG, WebP, or SVG) in this
        images folder. Open about.html, find src="images/about.svg", and
        change it to your file name, such as src="images/our-team.jpg".
        Then rewrite that image's alt="..." text to describe your picture.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1d35"/>
      <stop offset="1" stop-color="#0a1628"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#36cfff" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <path d="M400 290 230 170M400 290 590 160M400 290 610 400M400 290 220 420M230 170 590 160M220 420 610 400M230 170 220 420M590 160 610 400" fill="none" stroke="#36cfff" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="400" cy="290" r="64" fill="#0f2038" stroke="#36cfff" stroke-width="3"/>
  <circle cx="400" cy="290" r="22" fill="#36cfff"/>
  <g fill="#0f2038" stroke="#dce6f3" stroke-opacity="0.7" stroke-width="2">
    <circle cx="230" cy="170" r="40"/>
    <circle cx="590" cy="160" r="46"/>
    <circle cx="610" cy="400" r="38"/>
    <circle cx="220" cy="420" r="44"/>
  </g>
  <g fill="#dce6f3" fill-opacity="0.8">
    <circle cx="230" cy="170" r="10"/>
    <circle cx="610" cy="400" r="9"/>
    <circle cx="220" cy="420" r="11"/>
  </g>
  <circle cx="590" cy="160" r="12" fill="#ffb547"/>
  <text x="40" y="560" fill="#a3b4cb" font-family="Arial, Helvetica, sans-serif" font-size="26">Image (800 x 600)</text>
</svg>
