<!--
  PLACEHOLDER IMAGE: images/showcase-6.svg (800 x 600)
  WHAT: A stand-in picture drawn with code: a network of points.
  HOW TO SWAP IT: Save your real image (JPG, PNG, WebP, or SVG) in this
        images folder. Open showcase.html, find src="images/showcase-6.svg",
        and change it to your file name, such as src="images/project-six.jpg".
        Then rewrite that image's alt="..." text to describe your picture.
        Tip: a 4:3 shape (such as 800 x 600 pixels) fits the cards best.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1d35"/>
      <stop offset="1" stop-color="#0a1628"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#36cfff" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <path d="M170 190 320 130 450 230 170 190M450 230 630 150 700 290 590 370 450 230M450 230 420 410 250 370 170 190M420 410 590 370" fill="none" stroke="#36cfff" stroke-opacity="0.5" stroke-width="2" stroke-linejoin="round"/>
  <g fill="#0f2038" stroke="#dce6f3" stroke-opacity="0.8" stroke-width="3">
    <circle cx="170" cy="190" r="10"/>
    <circle cx="320" cy="130" r="10"/>
    <circle cx="630" cy="150" r="10"/>
    <circle cx="700" cy="290" r="10"/>
    <circle cx="250" cy="370" r="10"/>
    <circle cx="420" cy="410" r="10"/>
  </g>
  <circle cx="450" cy="230" r="20" fill="#36cfff"/>
  <circle cx="590" cy="370" r="12" fill="#ffb547"/>
  <text x="40" y="560" fill="#a3b4cb" font-family="Arial, Helvetica, sans-serif" font-size="26">Image 6 (800 x 600)</text>
</svg>
