<!--
  PLACEHOLDER IMAGE: images/showcase-3.svg (800 x 600)
  WHAT: A stand-in picture drawn with code: three flowing waves.
  HOW TO SWAP IT: Save your real image (JPG, PNG, WebP, or SVG) in this
        images folder. Open showcase.html, find src="images/showcase-3.svg",
        and change it to your file name, such as src="images/project-three.jpg".
        Then rewrite that image's alt="..." text to describe your picture.
        Tip: a 4:3 shape (such as 800 x 600 pixels) fits the cards best.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
