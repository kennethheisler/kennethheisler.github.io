<!--
  LOGO PLACEHOLDER: images/logo.svg (64 x 64)
  WHAT: A simple stand-in logo mark: a rounded square with a star.
  HOW TO SWAP IT: Save your own logo in this images folder as logo.svg,
        replacing this file. Or give it another name and update src="..."
        in the header and footer of every page, plus the favicon line
        (rel="icon") in each page's head. A square image works best.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#36cfff"/>
  <path d="M32 11 37.5 26.5 53 32 37.5 37.5 32 53 26.5 37.5 11 32 26.5 26.5Z" fill="#0a1628"/>
</svg>
