<!-- Experience image: BS in Informatics, a graduation cap on an open book, with a bar chart (Informatics) and a leaf (Natural Resource Economics minor) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1d35"/>
      <stop offset="1" stop-color="#0a1628"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#36cfff" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <g fill="#dce6f3" fill-opacity="0.6">
    <circle cx="110" cy="120" r="2.5"/><circle cx="700" cy="110" r="2"/><circle cx="80" cy="470" r="2"/><circle cx="715" cy="500" r="2.5"/>
  </g>

  <!-- The open book -->
  <path d="M400 470C340 440 270 432 205 444V340C270 328 340 336 400 366Z" fill="#0f2038" stroke="#36cfff" stroke-width="3" stroke-linejoin="round"/>
  <path d="M400 470C460 440 530 432 595 444V340C530 328 460 336 400 366Z" fill="#0f2038" stroke="#36cfff" stroke-width="3" stroke-linejoin="round"/>
  <path d="M400 366V470" stroke="#36cfff" stroke-width="3"/>
  <g fill="none" stroke="#36cfff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round">
    <path d="M232 378C275 371 325 374 372 391"/><path d="M232 402C275 395 325 398 372 415"/><path d="M232 426C275 419 325 422 372 439"/>
  </g>
  <!-- A small rising bar chart on the right page (Informatics) -->
  <g fill="#36cfff" fill-opacity="0.55">
    <rect x="440" y="404" width="20" height="34" rx="3"/>
    <rect x="472" y="388" width="20" height="50" rx="3"/>
    <rect x="504" y="374" width="20" height="64" rx="3"/>
  </g>
  <rect x="536" y="356" width="20" height="82" rx="3" fill="#ffb547"/>
  <path d="M432 446H566" stroke="#36cfff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>

  <!-- The graduation cap, resting on the book -->
  <path d="M400 150 590 222 400 294 210 222Z" fill="#0f2038" stroke="#36cfff" stroke-width="3" stroke-linejoin="round"/>
  <path d="M300 258V306C335 336 465 336 500 306V258" fill="#0b1a2f" stroke="#36cfff" stroke-width="3" stroke-linejoin="round"/>
  <path d="M400 222 560 233V300" fill="none" stroke="#ffb547" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="400" cy="222" r="7" fill="#ffb547"/>
  <path d="M552 300H568L574 330H546Z" fill="#ffb547"/>

  <!-- A leaf (Natural Resource Economics minor) -->
  <g transform="translate(78 262) rotate(-25)">
    <path d="M0 0C40 -40 100 -40 120 0C100 40 40 40 0 0Z" fill="#36cfff" fill-opacity="0.15" stroke="#36cfff" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M0 0H112M40 0 62 -18M40 0 62 18M72 0 90 -14M72 0 90 14" fill="none" stroke="#36cfff" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Network nodes, like the other experience images -->
  <g fill="none" stroke="#dce6f3" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round">
    <path d="M640 150 690 190 650 245"/>
  </g>
  <g fill="#dce6f3" fill-opacity="0.8"><circle cx="640" cy="150" r="5"/><circle cx="690" cy="190" r="5"/></g>
  <circle cx="650" cy="245" r="5" fill="#ffb547"/>
  <g fill="none" stroke="#36cfff" stroke-width="2" stroke-opacity="0.45" stroke-linecap="round">
    <path d="M150 470Q170 510 220 520"/><path d="M650 470Q630 510 580 520"/>
  </g>
