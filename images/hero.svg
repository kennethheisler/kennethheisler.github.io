<!--
  PLACEHOLDER IMAGE: images/hero.svg (640 x 520)
  WHAT: A stand-in picture drawn with code. SVG ("Scalable Vector
        Graphics") describes shapes as text, so it stays sharp at any size.
  HOW TO SWAP IT: Save your real image (JPG, PNG, WebP, or SVG) in this
        images folder. Open index.html, find src="images/hero.svg", and
        change it to your file name, such as src="images/my-photo.jpg".
        Update the width and height numbers next to it to your image's
        size, and rewrite the alt="..." text to describe your picture.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1d35"/>
      <stop offset="1" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36cfff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#36cfff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#36cfff" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="640" height="520" fill="url(#bg)"/>
  <rect width="640" height="520" fill="url(#grid)"/>

  <!-- App window -->
  <rect x="48" y="56" width="544" height="360" rx="14" fill="#0f2038" stroke="#2c4870"/>
