  <rect x="72" y="172" width="84" height="10" rx="5" fill="#2c4870"/>
  <rect x="72" y="196" width="64" height="10" rx="5" fill="#2c4870"/>
  <rect x="72" y="220" width="80" height="10" rx="5" fill="#2c4870"/>

  <!-- Line chart -->
  <rect x="188" y="116" width="380" height="176" rx="10" fill="#0c1b31" stroke="#22385a"/>
  <path d="M212 160H544M212 200H544M212 240H544" stroke="#22385a" stroke-dasharray="4 6"/>
  <path d="M212 262 262 244 312 252 362 214 412 226 462 186 512 196 544 152V272H212Z" fill="url(#area)"/>
  <path d="M212 262 262 244 312 252 362 214 412 226 462 186 512 196 544 152" fill="none" stroke="#36cfff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="544" cy="152" r="6" fill="#ffb547" stroke="#0c1b31" stroke-width="3"/>

  <!-- Number tiles -->
  <rect x="188" y="308" width="116" height="84" rx="10" fill="#0c1b31" stroke="#22385a"/>
  <rect x="320" y="308" width="116" height="84" rx="10" fill="#0c1b31" stroke="#22385a"/>
  <rect x="204" y="326" width="48" height="8" rx="4" fill="#5d7598"/>
  <rect x="204" y="346" width="72" height="20" rx="4" fill="#dce6f3" fill-opacity="0.85"/>
  <rect x="336" y="326" width="56" height="8" rx="4" fill="#5d7598"/>
  <rect x="336" y="346" width="64" height="20" rx="4" fill="#dce6f3" fill-opacity="0.85"/>

  <!-- Floating progress card -->
  <rect x="440" y="300" width="160" height="164" rx="14" fill="#142a47" stroke="#36cfff" stroke-opacity="0.6"/>
