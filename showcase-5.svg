      <stop offset="0" stop-color="#0d1d35"/>
      <stop offset="1" stop-color="#0a1628"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#36cfff" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <path d="M140 460H660" stroke="#5d7598" stroke-width="2"/>
  <g fill="#36cfff" fill-opacity="0.25" stroke="#36cfff" stroke-width="2">
    <rect x="170" y="340" width="50" height="120" rx="6"/>
    <rect x="250" y="280" width="50" height="180" rx="6"/>
    <rect x="330" y="310" width="50" height="150" rx="6"/>
    <rect x="410" y="220" width="50" height="240" rx="6"/>
    <rect x="490" y="260" width="50" height="200" rx="6"/>
  </g>
  <rect x="570" y="160" width="50" height="300" rx="6" fill="#ffb547"/>
  <path d="M195 320 275 260 355 290 435 200 515 240 595 140" fill="none" stroke="#dce6f3" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#dce6f3">
    <circle cx="195" cy="320" r="5"/>
    <circle cx="275" cy="260" r="5"/>
    <circle cx="355" cy="290" r="5"/>
    <circle cx="435" cy="200" r="5"/>
    <circle cx="515" cy="240" r="5"/>
    <circle cx="595" cy="140" r="5"/>
  </g>
  <text x="40" y="560" fill="#a3b4cb" font-family="Arial, Helvetica, sans-serif" font-size="26">Image 5 (800 x 600)</text>
</svg>
