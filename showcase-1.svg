<!--
  PLACEHOLDER IMAGE: images/showcase-1.svg (800 x 600)
  WHAT: A stand-in picture drawn with code: a planet with orbits.
  HOW TO SWAP IT: Save your real image (JPG, PNG, WebP, or SVG) in this
        images folder. Open showcase.html, find src="images/showcase-1.svg",
        and change it to your file name, such as src="images/project-one.jpg".
        Then rewrite that image's alt="..." text to describe your picture.
        Tip: a 4:3 shape (such as 800 x 600 pixels) fits the cards best.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1d35"/>
      <stop offset="1" stop-color="#0a1628"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#36cfff" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <g fill="#dce6f3" fill-opacity="0.6">
    <circle cx="120" cy="110" r="2.5"/>
    <circle cx="690" cy="90" r="2"/>
    <circle cx="720" cy="470" r="2.5"/>
    <circle cx="90" cy="420" r="2"/>
    <circle cx="560" cy="510" r="2"/>
  </g>
  <g fill="none" stroke="#36cfff" stroke-width="2" transform="rotate(-18 400 290)">
    <ellipse cx="400" cy="290" rx="260" ry="90" stroke-opacity="0.35"/>
    <ellipse cx="400" cy="290" rx="190" ry="64" stroke-opacity="0.6"/>
  </g>
  <circle cx="400" cy="290" r="70" fill="#0f2038" stroke="#36cfff" stroke-width="3"/>
  <circle cx="400" cy="290" r="34" fill="#36cfff" fill-opacity="0.85"/>
  <circle cx="623" cy="185" r="14" fill="#ffb547"/>
  <circle cx="237" cy="366" r="9" fill="#dce6f3"/>
  <text x="40" y="560" fill="#a3b4cb" font-family="Arial, Helvetica, sans-serif" font-size="26">Image 1 (800 x 600)</text>
</svg>
